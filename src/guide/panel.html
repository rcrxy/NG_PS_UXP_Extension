<div class="guide-panel">
    <div class="guide-row">
        <sp-field-label class="guide-label" for="horizontal-input">水平位置（Y）</sp-field-label>
        <sp-textfield id="horizontal-input" size="s"></sp-textfield>
    </div>

    <div class="guide-row">
        <sp-field-label class="guide-label" for="vertical-input">垂直位置（X）</sp-field-label>
        <sp-textfield id="vertical-input" size="s"></sp-textfield>
    </div>

    <div class="guide-actions">
        <div class="button-box">
            <sp-action-button id="create-guides-btn" size="s" variant="cta">创建参考线</sp-action-button>
        </div>
        <div class="button-box">
            <sp-action-button id="reload-input-btn" size="s" variant="secondary">清空输入</sp-action-button>
        </div>
        <div class="button-box">
            <sp-action-button id="clear-guides-btn" size="s" variant="secondary">清空参考线</sp-action-button>
        </div>
    </div>

    <div id="status" class="guide-status"></div>
</div>
